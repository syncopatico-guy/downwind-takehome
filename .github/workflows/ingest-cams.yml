name: Ingest CAMS model air quality

on:
  schedule:
    # Every 6 hours, offset from the hourly job at :34 so they do not contend
    # for Open-Meteo's rate limit simultaneously -- 23 minutes apart, against
    # an hourly job that finishes in 2-3 minutes and is capped at 15.
    #
    # Cadence is set by the MODEL, not by us: CAMS publishes on a ~12h cycle.
    # Measured, an hourly run 30 minutes after a full pull returned 0 new rows
    # from 96,912 fetched -- the value-hash dedupe correctly rejecting every
    # one. Polling twice per cycle picks up an update within 6 hours without
    # spending ~200 requests a day to discard identical data.
    # Offset off :00/:15/:30/:45. Measured 2026-09-22: two hours after these
    # workflows registered, GitHub had fired ZERO scheduled runs across all
    # five, while manual dispatches of the same files succeeded. Nothing in the
    # configuration was wrong -- public repo, Actions enabled, workflows active
    # on the default branch, valid expressions. The quarter-hour boundaries are
    # the most contended slots on the platform and GitHub drops scheduled
    # events under load, so the schedule now avoids them.
    - cron: '57 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: ingest-cams
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: |
          npm run ingest:openmeteo -- --mode=cams --trigger=cron --past-days=1 --forecast-days=1
