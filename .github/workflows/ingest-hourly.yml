name: Ingest hourly feeds

on:
  schedule:
    # UTC. GitHub delays scheduled runs under load and may skip them entirely;
    # ingest_runs records every attempt with its intended window, so a missed
    # tick shows up as a provable gap rather than a silent hole.
    - cron: '5 * * * *'
  workflow_dispatch:

# A slow run must never overlap the next tick: concurrent ingest runs would
# race on the same rows and muddy the provenance log.
concurrency:
  group: ingest-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: |
          # Open-Meteo weights requests by COST, not count: a 429 landed after
          # only 3 large calls during the 7-day backfill. The hourly run asks
          # for past_days=1, which cuts the weight roughly fourfold. Deeper
          # history is a one-off backfill, not something a cron repeats.
          npm run ingest:openaq -- --mode=latest --trigger=cron --budget=10
          npm run ingest:openmeteo -- --mode=weather --trigger=cron --past-days=1 --forecast-days=2
          npm run ingest:openmeteo -- --mode=cams --trigger=cron --past-days=1 --forecast-days=2
