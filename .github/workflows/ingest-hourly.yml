name: Ingest hourly feeds

on:
  schedule:
    # UTC. GitHub delays scheduled runs under load and may skip them entirely;
    # ingest_runs records every attempt with its intended window, so a missed
    # tick shows up as a provable gap rather than a silent hole.
    # Offset off :00/:15/:30/:45. Measured 2026-09-22: two hours after these
    # workflows registered, GitHub had fired ZERO scheduled runs across all
    # five, while manual dispatches of the same files succeeded. Nothing in the
    # configuration was wrong -- public repo, Actions enabled, workflows active
    # on the default branch, valid expressions. The quarter-hour boundaries are
    # the most contended slots on the platform and GitHub drops scheduled
    # events under load, so the schedule now avoids them.
    - cron: '34 * * * *'
  workflow_dispatch:

# A slow run must never overlap the next tick: concurrent ingest runs would
# race on the same rows and muddy the provenance log.
concurrency:
  group: ingest-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: |
          # CAMS is NOT here: it updates on a ~12h cycle, so 11 of every 12
          # hourly runs fetched ~97,000 rows the dedupe then discarded. It has
          # its own 6-hourly workflow.
          #
          # past_days=1 keeps the hourly run cheap in rows and bandwidth --
          # deeper history is a one-off backfill, not something a cron repeats.
          # Note it does NOT avoid rate limiting: measured, a 429 still lands
          # after ~4 requests with past_days=1, so the limit tracks locations
          # per request (or requests per minute), not the span requested.
          npm run ingest:openaq -- --mode=latest --trigger=cron --budget=10
          npm run ingest:openmeteo -- --mode=weather --trigger=cron --past-days=1 --forecast-days=1

  # The derived layer -- clustering, attribution, frames -- had no schedule at
  # all. Raw measurements ran to 13:07 while hourly_frames stopped at 02:00, so
  # the timeline would have sat ~12 hours behind the map.
  #
  # A separate job rather than more steps in the one above, for two reasons it
  # earns: an Open-Meteo 429 in the ingest must not also skip the rebuild,
  # which is pure database work and still useful on slightly older data; and a
  # rebuild failure must not mask a successful ingest in the run status.
  # `needs` keeps the ordering, `if: always()` keeps the independence.
  derive:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild the derived layer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Order is a real dependency, not a preference: attribution reads
          # clusters, and frames read both.
          #
          # One-cycle lag is expected and self-correcting. Clustering creates a
          # sample_point for each new fire, but wind is only sampled at points
          # that were active when the ingest above ran -- so a fire first seen
          # this cycle has no wind at its location yet and cannot be attributed
          # until the next one. Measured: 137 of 618 fire points currently
          # carry wind. Forcing it would mean re-running the wind ingest here,
          # which costs an Open-Meteo call to save an hour of latency.
          npm run cluster:fires -- --trigger=cron
          npm run attribute:smoke -- --trigger=cron

          # --days=2, not the 9-day default. The rollup upserts, so a full
          # rebuild rewrites 176k rows and leaves that many dead tuples: one
          # pass took the table from 28 MB to 49 MB. Two days covers the window
          # where raw data still changes (late OpenAQ corrections, FIRMS
          # reprocessing) at a quarter of the churn -- measured 44k rows
          # rewritten instead of 176k, +1 MB instead of +21 MB. A full rebuild
          # stays a manual operation.
          npm run build:frames -- --trigger=cron --days=2 --vacuum
