name: Ingest hourly feeds

on:
  schedule:
    # UTC. GitHub delays scheduled runs under load and may skip them entirely;
    # ingest_runs records every attempt with its intended window, so a missed
    # tick shows up as a provable gap rather than a silent hole.
    - cron: '5 * * * *'
  workflow_dispatch:

# A slow run must never overlap the next tick: concurrent ingest runs would
# race on the same rows and muddy the provenance log.
concurrency:
  group: ingest-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: |
          # CAMS is NOT here: it updates on a ~12h cycle, so 11 of every 12
          # hourly runs fetched ~97,000 rows the dedupe then discarded. It has
          # its own 6-hourly workflow.
          #
          # past_days=1 keeps the hourly run cheap in rows and bandwidth --
          # deeper history is a one-off backfill, not something a cron repeats.
          # Note it does NOT avoid rate limiting: measured, a 429 still lands
          # after ~4 requests with past_days=1, so the limit tracks locations
          # per request (or requests per minute), not the span requested.
          npm run ingest:openaq -- --mode=latest --trigger=cron --budget=10
          npm run ingest:openmeteo -- --mode=weather --trigger=cron --past-days=1 --forecast-days=1
